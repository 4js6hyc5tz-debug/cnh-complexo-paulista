<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complexo Paulista - Portal CNH</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: #38bdf8;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .header p {
            color: #94a3b8;
            font-size: 14px;
        }

        .badge {
            display: inline-block;
            background-color: #0284c7;
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #cbd5e1;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: #38bdf8;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 10px;
        }

        button:hover {
            opacity: 0.9;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <span class="badge">GTA RP</span>
            <h1>Complexo Paulista</h1>
            <p>Portal Oficial de Agendamento e Emissão de CNH</p>
        </div>

        <form onsubmit="alert('Solicitação enviada com sucesso!'); return false;">
            <div class="form-group">
                <label for="nome">Nome Completo (RP):</label>
                <input type="text" id="nome" placeholder="Ex: Ruan Martins" required>
            </div>

            <div class="form-group">
                <label for="passaporte">ID / Passaporte:</label>
                <input type="number" id="passaporte" placeholder="Ex: 1234" required>
            </div>

            <div class="form-group">
                <label for="categoria">Categoria da CNH:</label>
                <select id="categoria" required>
                    <option value="">Selecione uma categoria...</option>
                    <option value="A">Categoria A (Motos)</option>
                    <option value="B">Categoria B (Carros)</option>
                    <option value="AB">Categoria AB (Carros e Motos)</option>
                    <option value="C">Categoria C (Camiões / Veículos Pesados)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="discord">Discord Tag (para contacto):</label>
                <input type="text" id="discord" placeholder="Ex: usuario#0000 ou @usuario" required>
            </div>

            <button type="submit">Solicitar Agendamento / Exame</button>
        </form>

        <div class="footer">
            <p>&copy; Complexo Paulista Roleplay - Todos os direitos reservados.</p>
        </div>
    </div>

</body>
</html>
